<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Mosqlimate Charts Playground</title>

    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js"></script>
  </head>

  <body>
    <h2>infodengue — Rt <span class="badge">pt</span></h2>
    <div class="grid-2">
      <div
        data-chart="infodengue/rt"
        data-disease="dengue"
        data-geocode="2300507"
        data-start="2025-01-01"
        data-end="2025-12-31"
        data-language="pt"
        style="height:350px;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:16px"
      ></div>

      <mosqlimate-chart
        chart="infodengue/rt"
        disease="dengue"
        geocode="2300507"
        start="2025-01-01"
        end="2025-12-31"
        language="pt"
        style="display:block;height:350px;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:16px"
      ></mosqlimate-chart>
    </div>

    <h2>climate — Temperature</h2>
    <div class="grid-2">
      <div
        data-chart="climate/temperature"
        data-geocode="2300507"
        data-start="2025-10-01"
        data-end="2025-12-31"
        style="height:350px;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:16px"
      ></div>

      <mosqlimate-chart
        chart="climate/temperature"
        geocode="2300507"
        start="2025-10-01"
        end="2025-12-31"
        style="display:block;height:350px;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:16px"
      ></mosqlimate-chart>
    </div>

    <h2>climate — Accumulated Waterfall</h2>
    <div class="grid-2">
      <div>
        <div
          data-chart="climate/accumulated-waterfall"
          data-geocode="2300507"
          data-start="2025-01-01"
          data-end="2025-12-31"
          style="height:350px;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:16px"
        ></div>
      </div>

      <div>
        <mosqlimate-chart
          chart="climate/accumulated-waterfall"
          geocode="2300507"
          start="2025-01-01"
          end="2025-12-31"
          style="display:block;height:350px;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:16px"
        ></mosqlimate-chart>
      </div>
    </div>

    <h2>climate — Humidity &amp; Pressure</h2>
    <div class="grid-2">
      <div>
        <div
          data-chart="climate/umid-pressao-med"
          data-geocode="2300507"
          data-start="2025-01-01"
          data-end="2025-12-31"
          style="height:350px;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:16px"
        ></div>
      </div>

      <div>
        <mosqlimate-chart
          chart="climate/umid-pressao-med"
          geocode="2300507"
          start="2025-01-01"
          end="2025-12-31"
          style="display:block;height:350px;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:16px"
        ></mosqlimate-chart>
      </div>
    </div>

    <h2>contaovos — Eggs Density</h2>
    <div class="grid-2">
      <div
        data-chart="contaovos/eggs_density"
        data-start="2024-01-01"
        data-end="2024-12-31"
        style="height:350px;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:16px"
      ></div>

      <mosqlimate-chart
        chart="contaovos/eggs_density"
        start="2024-01-01"
        end="2024-12-31"
        style="display:block;height:350px;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:16px"
      ></mosqlimate-chart>
    </div>

    <h2>contaovos — Positivity</h2>
    <div class="grid-2">
      <div
        data-chart="contaovos/positivity"
        data-start="2024-01-01"
        data-end="2024-12-31"
        style="height:350px;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:16px"
      ></div>

      <mosqlimate-chart
        chart="contaovos/positivity"
        start="2024-01-01"
        end="2024-12-31"
        style="display:block;height:350px;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:16px"
      ></mosqlimate-chart>
    </div>

    <div class="log" id="log">
      <span id="loader">Loading...</span>
    </div>

    <!--CONFIG-->
    <script type="module">
      import { Mosqlimate } from "/packages/core/dist/index.js";

      const result = await Mosqlimate.autoInit({
        api_key: window.__MOSQLIMATE_API_KEY__,
      });

      document.getElementById("loader").remove();

      const log = document.getElementById("log");

      log.textContent = `Rendered ${result.rendered} charts.`;

      if (result.errors.length) {
        log.textContent += ` Errors:\n${result.errors
          .map((e) => "  " + String(e))
          .join("\n")}`;
      }
    </script>
  </body>
</html>
